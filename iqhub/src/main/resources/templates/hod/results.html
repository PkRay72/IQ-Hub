<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Student Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h4>All Student Results</h4>
    <a th:href="@{/hod/dashboard}" class="btn btn-sm btn-secondary mb-3">Back</a>
    <table class="table table-bordered">
        <thead>
        <tr><th>Student ID</th><th>Student Name</th><th>Test</th><th>Score</th><th>Rating</th><th>Tab Switches</th><th>Submitted At</th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${results}">
            <td th:text="${r.student.id}"></td>
            <td th:text="${r.student.fullName}"></td>
            <td th:text="${r.test.title}"></td>
            <td th:text="${r.correctCount} + '/' + ${r.totalQuestions} + ' (' + ${#numbers.formatDecimal(r.score,1,1)} + '%)'"></td>
            <td th:text="${r.rating} + '/5'"></td>
            <td th:text="${r.tabSwitchCount}"></td>
            <td th:text="${r.submittedAt}"></td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(results)}">Abhi tak koi result nahi hai.</p>
</div>
</body>
</html>
