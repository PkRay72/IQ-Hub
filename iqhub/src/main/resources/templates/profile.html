<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width:600px;">
    <h4>My Profile</h4>
    <p th:if="${success}" class="alert alert-success" th:text="${success}"></p>
    <p th:if="${error}" class="alert alert-danger" th:text="${error}"></p>

    <div class="card mb-4">
        <div class="card-body">
            <p><b>Unique ID:</b> <span th:text="${user.id}"></span></p>
            <p><b>Username:</b> <span th:text="${user.username}"></span></p>
            <p><b>Role:</b> <span th:text="${user.role}"></span></p>

            <h6 class="mt-3">Update Details</h6>
            <form method="post" th:action="@{/profile/update}">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input class="form-control" name="fullName" th:value="${user.fullName}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" th:value="${user.email}" required>
                </div>
                <button type="submit" class="btn btn-primary">Update Profile</button>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h6>Change Password</h6>
            <form method="post" th:action="@{/profile/change-password}">
                <div class="mb-3">
                    <label class="form-label">Current Password</label>
                    <input type="password" class="form-control" name="currentPassword" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" name="newPassword"
                           pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$%^&+=!_\-.]).{8,}$"
                           title="Kam se kam 8 characters, ek CAPITAL letter, ek small letter, ek number, aur ek special character (@#$%^&+=!) hona chahiye"
                           required>
                    <small class="text-muted">Kam se kam 8 characters, 1 CAPITAL, 1 small, 1 number, 1 special character (@#$%^&+=!)</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" name="confirmPassword" required>
                </div>
                <button type="submit" class="btn btn-warning">Change Password</button>
            </form>
        </div>
    </div>

    <button class="btn btn-secondary" onclick="history.back()">Back</button>
</div>
</body>
</html>
