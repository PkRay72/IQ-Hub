<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4" style="max-width:700px;">
    <h4>Create Test (sirf approved questions use ho sakte hain)</h4>
    <form method="post" th:action="@{/teacher/tests/create}">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input class="form-control" name="title" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Subject</label>
            <input class="form-control" name="subject" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Duration (minutes)</label>
            <input type="number" class="form-control" name="durationMinutes" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Select Approved Questions</label>
            <div th:each="q : ${approvedQuestions}" class="form-check">
                <input class="form-check-input" type="checkbox" name="questionIds" th:value="${q.id}">
                <label class="form-check-label" th:text="${q.questionText}"></label>
            </div>
            <p th:if="${#lists.isEmpty(approvedQuestions)}" class="text-muted">
                Koi approved question nahi hai abhi. Pehle HOD se approve karwaiye.
            </p>
        </div>
        <button type="submit" class="btn btn-success">Publish Test</button>
    </form>
</div>
</body>
</html>
