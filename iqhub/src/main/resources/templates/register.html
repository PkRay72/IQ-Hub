<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>IQHub - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" style="max-width:480px; margin-top:40px;">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="text-center mb-4">Create Account</h3>
            <p th:if="${success}" class="text-success" th:text="${success}"></p>
            <p th:if="${error}" class="text-danger" th:text="${error}"></p>
            <form method="post" th:action="@{/register}">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="fullName" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control"
                           pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$%^&+=!_\-.]).{8,}$"
                           title="Kam se kam 8 characters, ek CAPITAL letter, ek small letter, ek number, aur ek special character (@#$%^&+=!) hona chahiye"
                           required>
                    <small class="text-muted">Kam se kam 8 characters, 1 CAPITAL, 1 small, 1 number, 1 special character (@#$%^&+=!)</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-select" required>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100">Register</button>
            </form>
            <p class="text-center mt-3"><a th:href="@{/login}">Back to login</a></p>
        </div>
    </div>
</div>
</body>
</html>
