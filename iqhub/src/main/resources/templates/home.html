<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>IQHub - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5 text-center" style="max-width:700px;">
    <h1 class="mb-3">📘 Welcome to IQHub</h1>
    <p class="text-muted mb-4">AI-Based Smart Test & Assignment System — Teachers add questions, HOD reviews them,
        Students attempt secure tests, and results are auto-generated with improvement feedback.</p>

    <div sec:authorize="isAnonymous()">
        <a th:href="@{/login}" class="btn btn-primary btn-lg me-2">Login</a>
        <a th:href="@{/register}" class="btn btn-outline-primary btn-lg">Register</a>
    </div>

    <div sec:authorize="hasRole('TEACHER')">
        <a th:href="@{/teacher/dashboard}" class="btn btn-primary btn-lg">Go to Teacher Dashboard</a>
    </div>
    <div sec:authorize="hasRole('HOD')">
        <a th:href="@{/hod/dashboard}" class="btn btn-primary btn-lg">Go to HOD Dashboard</a>
    </div>
    <div sec:authorize="hasRole('STUDENT')">
        <a th:href="@{/student/dashboard}" class="btn btn-primary btn-lg">Go to Student Dashboard</a>
    </div>
</div>
</body>
</html>
