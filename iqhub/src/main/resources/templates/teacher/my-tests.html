<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Tests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h4>My Published Tests</h4>
    <a th:href="@{/teacher/dashboard}" class="btn btn-sm btn-secondary mb-3">Back</a>
    <div class="card mb-2" th:each="t : ${tests}">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h6 th:text="${t.title}"></h6>
                <small th:text="${t.subject} + ' | ' + ${t.durationMinutes} + ' minutes | ' + ${#lists.size(t.questions)} + ' questions'"></small>
            </div>
            <a th:href="@{/teacher/tests/{id}/results(id=${t.id})}" class="btn btn-primary">View Results</a>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(tests)}">Abhi koi test publish nahi kiya hai.</p>
</div>
</body>
</html>
