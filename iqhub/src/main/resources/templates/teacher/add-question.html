<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add / Improve Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width:700px;">
    <h4 th:text="${question.id} != null ? 'Improve Question #' + ${question.id} : 'Add New Question'"></h4>
    <p th:if="${question.reviewComment}" class="alert alert-info" th:text="'HOD feedback: ' + ${question.reviewComment}"></p>
    <form method="post"
          th:action="${question.id} != null ? @{/teacher/questions/edit/{id}(id=${question.id})} : @{/teacher/questions/add}"
          th:object="${question}">
        <div class="mb-3">
            <label class="form-label">Question Text</label>
            <textarea class="form-control" th:field="*{questionText}" required></textarea>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Option A</label>
                <input class="form-control" th:field="*{optionA}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Option B</label>
                <input class="form-control" th:field="*{optionB}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Option C</label>
                <input class="form-control" th:field="*{optionC}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Option D</label>
                <input class="form-control" th:field="*{optionD}" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Correct Option</label>
            <select class="form-select" th:field="*{correctOption}" required>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Subject</label>
            <input class="form-control" th:field="*{subject}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Difficulty</label>
            <select class="form-select" th:field="*{difficulty}" required>
                <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Exam Category</label>
            <select class="form-select" th:field="*{examCategory}" required>
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Submit for HOD Review</button>
        <a th:href="@{/teacher/dashboard}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
