<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${test.title}">Exam</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body { user-select: none; }
        #startOverlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(20,20,35,0.95); z-index: 9999;
            display:flex; align-items:center; justify-content:center; color:#fff; text-align:center;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="startOverlay">
    <div>
        <h3>Ready to start?</h3>
        <p>Exam fullscreen mode me chalega. Beech me fullscreen se bahar aane par warning milegi.</p>
        <button id="startExamBtn" class="btn btn-primary btn-lg">Start Exam (Fullscreen)</button>
    </div>
</div>

<div class="container mt-3" id="examContainer" style="display:none;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 th:text="${test.title}"></h4>
        <h5>Time Left: <span id="timer" class="badge bg-danger">--:--</span></h5>
    </div>
    <div id="warning" class="alert alert-warning d-none"></div>

    <form id="examForm">
        <div class="card mb-3" th:each="q, iter : ${test.questions}" th:attr="data-qid=${q.id}">
            <div class="card-body">
                <h6 th:text="${iter.count} + '. ' + ${q.questionText}"></h6>
                <div class="form-check" th:each="opt : ${ {'A','B','C','D'} }">
                    <input class="form-check-input" type="radio"
                           th:name="'q_' + ${q.id}" th:value="${opt}">
                    <label class="form-check-label"
                           th:text="${opt} + ') ' + (${opt} == 'A' ? ${q.optionA} : (${opt} == 'B' ? ${q.optionB} : (${opt} == 'C' ? ${q.optionC} : ${q.optionD})))"></label>
                </div>
            </div>
        </div>
        <button type="button" id="submitBtn" class="btn btn-primary w-100 mb-4">Submit Test</button>
    </form>
</div>

<script th:inline="javascript">
    const testId = /*[[${test.id}]]*/ 0;
    const durationMinutes = /*[[${test.durationMinutes}]]*/ 30;
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    let secondsLeft = durationMinutes * 60;
    let tabSwitchCount = 0;
    const MAX_WARNINGS = 3;
    let submitted = false;
    let examStarted = false;
    let timerInterval = null;

    const timerEl = document.getElementById('timer');
    const warningEl = document.getElementById('warning');
    const startOverlay = document.getElementById('startOverlay');
    const examContainer = document.getElementById('examContainer');

    function enterFullscreen() {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }

    function exitFullscreen() {
        if (document.fullscreenElement) {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    }

    document.getElementById('startExamBtn').addEventListener('click', function () {
        enterFullscreen();
        startOverlay.style.display = 'none';
        examContainer.style.display = 'block';
        examStarted = true;
        startTimer();
    });

    function startTimer() {
        timerInterval = setInterval(updateTimer, 1000);
        updateTimer();
    }

    function updateTimer() {
        const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
        const s = (secondsLeft % 60).toString().padStart(2, '0');
        timerEl.textContent = m + ':' + s;
        if (secondsLeft <= 0) {
            clearInterval(timerInterval);
            submitTest(false, "Time's up. Test auto-submitted.");
            return;
        }
        secondsLeft--;
    }

    function showWarning(msg) {
        warningEl.textContent = msg;
        warningEl.classList.remove('d-none');
    }

    function registerViolation(reason) {
        if (submitted || !examStarted) return;
        tabSwitchCount++;
        if (tabSwitchCount >= MAX_WARNINGS) {
            submitTest(true, "You switched tabs/windows or exited fullscreen too many times. Test auto-submitted.");
        } else {
            showWarning('Warning ' + tabSwitchCount + '/' + MAX_WARNINGS + ': ' + reason +
                ' Do not switch tabs or exit fullscreen during the exam or your test will be auto-submitted.');
        }
    }

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            registerViolation('You left the exam tab.');
        }
    });

    window.addEventListener('blur', function () {
        registerViolation('You switched to another window/application.');
    });

    document.addEventListener('fullscreenchange', function () {
        if (examStarted && !submitted && !document.fullscreenElement) {
            registerViolation('You exited fullscreen mode.');
        }
    });

    document.addEventListener('keydown', function (e) {
        const blocked =
            e.key === 'F12' ||
            (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key)) ||
            (e.ctrlKey && ['t', 'n', 'w'].includes(e.key.toLowerCase()));
        if (blocked) {
            e.preventDefault();
            registerViolation('Attempt to open a new tab/window/devtools was blocked.');
        }
    });

    function collectAnswers() {
        const answers = [];
        document.querySelectorAll('#examForm .card').forEach(card => {
            const qid = card.getAttribute('data-qid');
            const selected = card.querySelector('input[type=radio]:checked');
            answers.push({ questionId: parseInt(qid), selectedOption: selected ? selected.value : null });
        });
        return answers;
    }

    function submitTest(autoSubmitted, message) {
        if (submitted) return;
        submitted = true;
        clearInterval(timerInterval);
        if (message) showWarning(message);

        const payload = {
            answers: collectAnswers(),
            tabSwitchCount: tabSwitchCount,
            autoSubmitted: autoSubmitted
        };

        fetch('/student/test/' + testId + '/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },
            body: JSON.stringify(payload)
        })
        .then(res => res.json().then(data => ({ status: res.status, body: data })))
        .then(result => {
            exitFullscreen();
            window.location.href = result.body.redirect;
        })
        .catch(() => {
            exitFullscreen();
            alert('Submission failed. Please contact your teacher.');
        });
    }

    document.getElementById('submitBtn').addEventListener('click', function () {
        submitTest(false, null);
    });
</script>
</body>
</html>
